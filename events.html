<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AQUACARE | Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="AquaCare Logo" width="60">
            AQUACARE
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="events.html" class="active">EVENTS</a>
            <a href="report.html">REPORT</a>
            <a href="learn.html">LEARN</a>
        </nav>

    <main>
        <section class="content-container">
            <h1 class="page-title">Join us!</h1>

            <div class="event-card">
                <img src="cleanup.webp" alt="Community Beach Cleanup" class="event-img">
                <div class="event-details-box">Beach Cleanup Drive</div>
                <button class="join-btn">Join</button>
            </div>

            <!-- Event 2 -->
            <div class="event-card">
                <img src="restoration.jpg" alt="River Waste Collection" class="event-img">
                <div class="event-details-box">River Restoration Project</div>

            <!-- Event 3 -->
            <div class="event-card">
                <img src="seminar.png" alt="Coastal & Marine Life Seminar" class="event-img">
                <div class="event-details-box">Coastal & Marine Life Seminar</div>
                <button class="join-btn">Join</button>
            </div>

            <!-- Event 4 -->
            <div class="event-card">
                <img src="exhibit.webp" alt="Ocean Art Exhibition" class="event-img">
                <div class="event-details-box">Upcycled Ocean Art Exhibition</div>
                <button class="join-btn">Join</button>

    <footer>
